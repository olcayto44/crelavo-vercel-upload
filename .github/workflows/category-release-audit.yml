name: Category release acceptance
on:
  push:
    branches: [feat/studio-cloud-elements-20261123]
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/lib/**'
      - 'middleware.ts'
      - 'scripts/category-release-audit.mjs'
      - '.github/workflows/category-release-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_APP_URL: https://www.crelavo.com
      AUDIT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          npm start > /tmp/crelavo-category-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/sitemap.xml > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 80 /tmp/crelavo-category-server.log
          exit 1
      - run: node scripts/category-release-audit.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: category-acceptance-report
          path: category-audit-results/
          if-no-files-found: warn
